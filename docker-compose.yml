version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/resume_interview
      - DATABASE_URL_SYNC=postgresql+psycopg2://postgres:postgres@db:5432/resume_interview
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=https://apihub.agnes-ai.com/v1
      - LLM_MODEL_FAST=agnes-2.5-flash
      - LLM_MODEL_BALANCED=agnes-2.5-flash
      - LLM_MODEL_JUDGE=agnes-2.5-flash
    depends_on:
      - db
    volumes:
      - ./app:/app/app

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_interview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
